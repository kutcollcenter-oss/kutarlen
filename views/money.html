  // Сохранить повторяющиеся платежи / цели / долги / курс (что передано). keep — не закрывать лист
  async function saveLists(body, keep) {
    const r = await api('PUT', '/api/money/lists', body);
    if (!r.ok) { if ($('err')) $('err').textContent = r.data.error || 'Ошибка'; return false; }
    D = r.data;
    if (!keep) closeSheet();
    render(); return true;
  }
  const seg = (items, on, attr) => `<div class="seg2">${items.map(([v, t]) => `<button type="button" data-${attr}="${v}" class="${v === on ? 'on' : ''}">${t}</button>`).join('')}</div>`;

  // Повторяющийся платёж: вид, категория, кошелёк, сумма, число месяца
  function recSheet(r) {
    const st = r ? { ...r } : { kind: 'out', catId: '', wallet: (D.wallets[0] || {}).id, amount: 0, day: Math.min(28, +today().slice(8)), note: '', active: true };
    const draw = () => {
      const cats = D.cats.filter(c => c.kind === st.kind);
      if (!cats.some(c => c.id === st.catId)) st.catId = (cats[0] || {}).id;
      openSheet(`<div class="head"><span class="dot" style="--c:#48484a">🔁</span><div><b>${r ? 'Повторяющийся платёж' : 'Новый повторяющийся платёж'}</b><span>каждый месяц, сам</span></div></div>
        ${seg([['out', 'Расход'], ['in', 'Доход']], st.kind, 'k')}
        <div class="lbl">Сумма</div><input class="big" id="amt" inputmode="numeric" placeholder="0" value="${st.amount ? nf.format(st.amount) : ''}">
        <div class="lbl">Категория</div>${chipList(cats, st.catId, 'ct')}
        <div class="lbl">${st.kind === 'in' ? 'В кошелёк' : 'Из кошелька'}</div>${chipList(D.wallets, st.wallet, 'wf')}
        <div class="two"><div><div class="lbl">Число месяца</div><input class="field" id="day" inputmode="numeric" maxlength="2" value="${st.day}"></div>
          <div><div class="lbl">Заметка</div><input class="field" id="nt" value="${esc(st.note || '')}" placeholder="например, Contabo"></div></div>
        ${r ? `<label class="tog"><input type="checkbox" id="act"${st.active ? ' checked' : ''}> Включён</label>` : ''}
        <p class="muted" style="margin:8px 2px 0">Запись появится сама в этот день каждого месяца. От 1 до 28 числа.</p>
        <p class="err" id="err"></p><button class="btn btn-main" type="button" id="ok">Сохранить</button>
        ${r ? '<div class="btns"><button class="btn btn-red" type="button" id="del">Удалить платёж</button></div>' : ''}`);
      fmtInput($('amt'));
      document.querySelectorAll('.sheet [data-k]').forEach(b => { b.onclick = () => { keep(); st.kind = b.dataset.k; draw(); }; });
      pickChips('ct', v => { st.catId = v; });
      pickChips('wf', v => { st.wallet = v; });
      $('ok').onclick = () => {
        keep();
        if (!st.amount) { $('err').textContent = 'Введите сумму'; return; }
        if (!(st.day >= 1 && st.day <= 28)) { $('err').textContent = 'Число месяца — от 1 до 28'; return; }
        if (!st.catId) { $('err').textContent = 'Выберите категорию'; return; }
        saveLists({ recurring: r ? D.recurring.map(x => (x.id === r.id ? st : x)) : [...D.recurring, st] });
      };
      if (r) $('del').onclick = () => saveLists({ recurring: D.recurring.filter(x => x.id !== r.id) });
    };
    // Запомнить введённое перед перерисовкой
    const keep = () => { if (!$('amt')) return; st.amount = +$('amt').value.replace(/\D/g, '') || 0; st.day = parseInt($('day').value) || 0; st.note = $('nt').value; if ($('act')) st.active = $('act').checked; };
    draw();
  }

  // Цель: название, сумма, валюта, к какой дате
  function goalSheet(g) {
    const st = g ? { ...g } : { name: '', icon: '🎯', color: '#ffc107', target: 0, currency: 'сом', until: '' };
    const s = g ? saved(g) : 0;
    const perMonth = () => { if (!st.until || !st.target) return ''; const [y, m] = st.until.split('-').map(Number), [ty, tm] = today().split('-').map(Number); const n = (y - ty) * 12 + (m - tm); return n > 0 && st.target > s ? `Чтобы успеть, откладывайте ${money(Math.ceil((st.target - s) / n), st.currency)} в месяц (${n} мес.)` : ''; };
    openSheet(`<div class="head"><span class="dot" id="pv"></span><div><b>${g ? 'Цель' : 'Новая цель'}</b><span>${g ? `отложено ${money(s, g.currency)}` : 'машина, квартира, отпуск'}</span></div></div>
      <input class="field" id="nm" value="${esc(st.name)}" placeholder="Название, например «Машина»" maxlength="30">
      <div class="two"><div><div class="lbl">Нужно накопить</div><input class="field" id="tg" inputmode="numeric" placeholder="0" value="${st.target ? nf.format(st.target) : ''}"></div>
        <div><div class="lbl">Валюта</div><select class="field" id="cu"><option${st.currency === 'сом' ? ' selected' : ''}>сом</option><option${st.currency === '$' ? ' selected' : ''}>$</option></select></div></div>
      <div class="lbl">К какой дате (необязательно)</div><input class="field" id="un" type="date" value="${esc(st.until)}">
      <p class="hint-l" id="pm">${perMonth()}</p>
      ${looks(st.icon, st.color)}<p class="err" id="err"></p>
      <button class="btn btn-main" type="button" id="ok">Сохранить</button>
      ${g ? '<div class="btns"><button class="btn btn-red" type="button" id="del">Удалить цель</button></div>' : ''}`);
    const pv = () => { $('pv').style.setProperty('--c', st.color); $('pv').textContent = st.icon; };
    pv(); bindLooks(st, pv); fmtInput($('tg'));
    const upd = () => { st.target = +$('tg').value.replace(/\D/g, '') || 0; st.until = $('un').value; st.currency = $('cu').value; $('pm').textContent = perMonth(); };
    ['tg', 'un', 'cu'].forEach(id => $(id).addEventListener('input', upd));
    $('ok').onclick = () => {
      upd(); st.name = $('nm').value.trim();
      if (!st.name) { $('err').textContent = 'Напишите название'; return; }
      if (!st.target) { $('err').textContent = 'Сколько нужно накопить?'; return; }
      saveLists({ goals: g ? D.goals.map(x => (x.id === g.id ? st : x)) : [...D.goals, st] });
    };
    if (g) $('del').onclick = () => saveLists({ goals: D.goals.filter(x => x.id !== g.id) });
  }

  // Долг: кто, сколько, в какую сторону, до какого числа
  function debtSheet(d) {
    const st = d ? { ...d } : { who: '', dir: 'they', amount: 0, currency: 'сом', due: '', note: '' };
    openSheet(`<div class="head"><span class="dot" style="--c:${st.dir === 'they' ? '#30a46c' : '#d9534f'}">${st.dir === 'they' ? '↘' : '↗'}</span><div><b>${d ? 'Долг' : 'Новый долг'}</b><span>${d ? esc(d.who) : 'кто кому должен'}</span></div></div>
      ${seg([['they', 'Мне должны'], ['me', 'Я должен']], st.dir, 'dr')}
      <input class="field" id="who" value="${esc(st.who)}" placeholder="Кто (имя)" maxlength="40">
      <div class="two"><div><div class="lbl">Сумма</div><input class="field" id="amt" inputmode="numeric" placeholder="0" value="${st.amount ? nf.format(st.amount) : ''}"></div>
        <div><div class="lbl">Валюта</div><select class="field" id="cu"><option${st.currency === 'сом' ? ' selected' : ''}>сом</option><option${st.currency === '$' ? ' selected' : ''}>$</option></select></div></div>
      ${d ? '' : '<div class="lbl" id="wl"></div><div id="wc"></div><p class="hint-l" id="wh"></p>'}
      <div class="two"><div><div class="lbl">Вернуть до</div><input class="field" id="due" type="date" value="${esc(st.due)}"></div>
        <div><div class="lbl">Заметка</div><input class="field" id="nt" value="${esc(st.note || '')}" placeholder="необязательно"></div></div>
      <p class="err" id="err"></p><button class="btn btn-main" type="button" id="ok">Сохранить</button>
      ${d ? '<div class="btns"><button class="btn btn-green" type="button" id="paid">✓ Долг вернули</button><button class="btn btn-red" type="button" id="del">Удалить</button></div>' : ''}`);
    fmtInput($('amt'));
    // Новый долг: деньги проходят через кошелёк — дал в долг (минус) или взял в долг (плюс). «Не отмечать» — кошелёк не меняется.
    let wid = '';
    const drawW = () => {
      if (d) return;
      const cur = $('cu').value;
      const ws = D.wallets.filter(w => w.currency === cur).sort((x, y) => balance(y) - balance(x)); // сначала тот, где больше денег
      if (wid !== 'none' && !ws.some(w => w.id === wid)) wid = (ws[0] || {}).id || 'none';
      $('wl').textContent = st.dir === 'they' ? 'Из какого кошелька дали' : 'В какой кошелёк получили';
      $('wc').innerHTML = chipList([...ws, { id: 'none', name: 'Не отмечать', icon: '—', color: '#48484a' }], wid, 'dw');
      const a = +$('amt').value.replace(/\D/g, '') || 0;
      $('wh').textContent = wid === 'none' ? 'Остаток кошельков не изменится.'
        : `${a ? money(a, cur) : 'Сумма'} ${st.dir === 'they' ? 'уйдёт из' : 'придёт в'} «${walletOf(wid).name}».`;
      pickChips('dw', v => { wid = v; drawW(); });
    };
    drawW();
    if (!d) { $('cu').onchange = drawW; $('amt').addEventListener('input', drawW); }
    document.querySelectorAll('.sheet [data-dr]').forEach(b => { b.onclick = () => { st.dir = b.dataset.dr; document.querySelectorAll('.sheet [data-dr]').forEach(x => x.classList.toggle('on', x === b)); drawW(); }; });
    $('ok').onclick = async () => {
      Object.assign(st, { who: $('who').value.trim(), amount: +$('amt').value.replace(/\D/g, '') || 0, currency: $('cu').value, due: $('due').value, note: $('nt').value });
      if (!st.who) { $('err').textContent = 'Кто должен?'; return; }
      if (!st.amount) { $('err').textContent = 'Введите сумму'; return; }
      if (d) { saveLists({ debts: D.debts.map(x => (x.id === d.id ? st : x)) }); return; }
      $('ok').disabled = true;
      const ids = new Set(D.debts.map(x => x.id));
      if (wid === 'none') st.noWallet = true; // кошелёк не трогаем — и не предлагаем «учесть» позже
      if (!(await saveLists({ debts: [...D.debts, st] }, true))) { $('ok').disabled = false; return; }
      const nd = D.debts.find(x => !ids.has(x.id));
      if (nd && wid !== 'none') {
        const r = await api('POST', '/api/money', { kind: 'debt', debtId: nd.id, flow: st.dir === 'they' ? 'out' : 'in', wallet: wid, amount: st.amount, date: today(), note: st.note })
          .catch(() => ({ ok: false, data: { error: 'Нет связи' } }));
        if (r.ok) D.entries.push(r.data); else toast(`Долг записан, но кошелёк не изменён: ${r.data.error || Object.values(r.data.errors || {})[0] || 'ошибка'}`, true);
      }
      closeSheet(); render(); toast('Долг записан');
    };
    if (d) {
      $('paid').onclick = () => debtReturnSheet(d);
      $('del').onclick = () => saveLists({ debts: D.debts.filter(x => x.id !== d.id) });
    }
  }

  // Старые долги (записаны до связи с кошельками): открытые, по которым в истории нет движения денег
  // и не выбрано «Не отмечать». Их можно разом «учесть»: запись в истории с датой долга и изменение кошелька.
  // «1 долг ещё не учтён», «3 долга ещё не учтены», «5 долгов ещё не учтены»
  const debtsWord = n => `${n} ${n % 10 === 1 && n % 100 !== 11 ? 'долг ещё не учтён' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'долга ещё не учтены' : 'долгов ещё не учтены'}`;
  const oldDebts = () => D.debts.filter(d => !d.closed && !d.noWallet && !D.entries.some(e => e.kind === 'debt' && e.debtId === d.id));
  function oldDebtsSheet() {
    const list = oldDebts();
    const NONE = { id: 'none', name: 'Не отмечать', icon: '—', color: '#48484a' };
    const pick = {};
    list.forEach(d => { const ws = D.wallets.filter(w => w.currency === d.currency).sort((x, y) => balance(y) - balance(x)); pick[d.id] = (ws[0] || NONE).id; });
    const day = d => (d.createdAt || '').slice(0, 10) || today();
    openSheet(`<div class="head"><span class="dot" style="--c:#48484a">⇄</span><div><b>Учесть старые долги</b><span>добавить в историю и в кошельки</span></div></div>
      <p class="hint-l" style="color:#c7c7cc">Эти долги записаны раньше, деньги по ним в кошельках не отмечены. Выберите кошелёк для каждого: «мне должны» — сумма уйдёт из кошелька (вы дали), «я должен» — придёт в кошелёк (вы взяли). Если деньги уже учтены вручную — «Не отмечать».</p>
      ${list.map(d => `<div class="od">
        <div class="row"><span class="dot" style="--c:${d.dir === 'they' ? '#30a46c' : '#d9534f'}">${d.dir === 'they' ? '↘' : '↗'}</span><div class="t"><b>${esc(d.who)}</b><span>${d.dir === 'they' ? 'должен мне — дал' : 'я должен — взял'} ${fmtDay(day(d))}</span></div><span class="a ${d.dir === 'they' ? 'out' : 'in'}">${d.dir === 'they' ? '−' : '+'}${money(d.amount, d.currency)}</span></div>
        ${chipList([...D.wallets.filter(w => w.currency === d.currency).sort((x, y) => balance(y) - balance(x)), NONE], pick[d.id], `od${d.id}`)}
      </div>`).join('')}
      <p class="err" id="err"></p>
      <button class="btn btn-main" type="button" id="ok">Учесть</button>`);
    list.forEach(d => pickChips(`od${d.id}`, v => { pick[d.id] = v; }));
    $('ok').onclick = async () => {
      $('ok').disabled = true; $('ok').textContent = 'Записываю…';
      for (const d of list) {
        if (pick[d.id] === 'none') continue;
        const r = await api('POST', '/api/money', { kind: 'debt', debtId: d.id, flow: d.dir === 'they' ? 'out' : 'in', wallet: pick[d.id], amount: d.amount, date: day(d), note: d.note || '' })
          .catch(() => ({ ok: false, data: { error: 'Нет связи' } }));
        if (!r.ok) { $('err').textContent = `${d.who}: ${Object.values(r.data.errors || {})[0] || r.data.error || 'ошибка'}`; $('ok').disabled = false; $('ok').textContent = 'Учесть'; return; }
        D.entries.push(r.data);
      }
      // «Не отмечать» — запоминаем, чтобы долг больше не предлагался
      const skip = new Set(list.filter(d => pick[d.id] === 'none').map(d => d.id));
      if (skip.size) await saveLists({ debts: D.debts.map(x => (skip.has(x.id) ? { ...x, noWallet: true } : x)) });
      else { closeSheet(); render(); }
      toast('Старые долги учтены ✓');
    };
  }

  // «Долг вернули»: выбрать кошелёк — мне вернули → сумма приходит в кошелёк; я вернул → уходит из кошелька
  function debtReturnSheet(d) {
    const they = d.dir === 'they';
    const ws = D.wallets.filter(w => w.currency === d.currency).sort((x, y) => balance(y) - balance(x)); // сначала тот, где больше денег
    let wid = (ws[0] || {}).id || 'none';
    openSheet(`<div class="head"><span class="dot" style="--c:${they ? '#30a46c' : '#d9534f'}">✓</span><div><b>Долг вернули</b><span>${esc(d.who)} · ${they ? 'должен мне' : 'я должен'}</span></div></div>
      <p class="big" style="text-align:center;margin:18px 0">${they ? '+' : '−'}${money(d.amount, d.currency)}</p>
      <div class="lbl">${they ? 'В какой кошелёк пришли деньги' : 'Из какого кошелька отдали'}</div>
      ${chipList([...ws, { id: 'none', name: 'Не отмечать', icon: '—', color: '#48484a' }], wid, 'rw')}
      <p class="hint-l" id="rh"></p>
      <div class="lbl">Дата</div><input class="field" id="rd" type="date" value="${today()}">
      <p class="err" id="err"></p>
      <button class="btn btn-main" type="button" id="ok">✓ Закрыть долг</button>
      <div class="btns"><button class="btn" type="button" id="back">Назад</button></div>`);
    const hint = () => { $('rh').textContent = wid === 'none' ? 'Остаток кошельков не изменится — долг просто закроется.' : `${money(d.amount, d.currency)} ${they ? 'прибавится к' : 'спишется с'} «${walletOf(wid).name}».`; };
    hint();
    pickChips('rw', v => { wid = v; hint(); });
    $('back').onclick = () => debtSheet(d);
    $('ok').onclick = async () => {
      $('ok').disabled = true;
      if (wid !== 'none') {
        const r = await api('POST', '/api/money', { kind: 'debt', debtId: d.id, flow: they ? 'in' : 'out', wallet: wid, amount: d.amount, date: $('rd').value || today(), note: d.note || '' })
          .catch(() => ({ ok: false, data: { error: 'Нет связи' } }));
        if (!r.ok) { $('err').textContent = Object.values(r.data.errors || {})[0] || r.data.error || 'Не получилось'; $('ok').disabled = false; return; }
      }
      if (await saveLists({ debts: D.debts.map(x => (x.id === d.id ? { ...x, closed: true } : x)) })) toast(they ? 'Долг закрыт, деньги в кошельке ✓' : 'Долг закрыт ✓');
      else $('ok').disabled = false;
    };
  }

  function pinSheet() {
    openSheet(`<div class="head"><span class="dot" style="--c:#48484a">🔒</span><div><b>Сменить пароль</b><span>только цифры</span></div></div>
      <div class="lbl">Старый пароль</div><input class="field" id="p0" type="password" inputmode="numeric" maxlength="12">
      <div class="lbl">Новый пароль</div><input class="field" id="p1" type="password" inputmode="numeric" maxlength="12">
      <div class="lbl">Новый ещё раз</div><input class="field" id="p2" type="password" inputmode="numeric" maxlength="12">
      <p class="err" id="err"></p><button class="btn btn-main" type="button" id="ok">Сохранить пароль</button>`);
    $('ok').onclick = async () => {
      const p = $('p1').value;
      if (!/^\d{2,12}$/.test(p)) { $('err').textContent = 'Новый пароль — только цифры, от 2 до 12'; return; }
      if (p !== $('p2').value) { $('err').textContent = 'Новые пароли не совпадают'; return; }
      const r = await api('PUT', '/api/money/pin', { old: $('p0').value, pin: p });
      if (!r.ok) { $('err').textContent = Object.values(r.data.errors || {})[0] || r.data.error || 'Ошибка'; return; }
      $('err').innerHTML = '<span class="ok">Пароль изменён ✓</span>';
      setTimeout(closeSheet, 1200);
    };
  }

  // Выбор месяца
  $('monthBtn').onclick = () => {
    const now = today().slice(0, 7), years = {};
    D.entries.forEach(e => { years[e.date.slice(0, 4)] = 1; });
    years[now.slice(0, 4)] = 1; years[month.slice(0, 4)] = 1;
    const ys = Object.keys(years).sort().reverse();
    openSheet(`<div class="head"><div><b>Месяц</b></div></div><div class="months">${ys.map(y => `<h4>${y}</h4>${MONTHS.map((n, i) => { const k = `${y}-${String(i + 1).padStart(2, '0')}`; return `<button type="button" data-m="${k}" class="${k === month ? 'on' : ''}">${n.slice(0, 3)}</button>`; }).join('')}`).join('')}</div>`);
    document.querySelectorAll('.sheet [data-m]').forEach(b => { b.onclick = () => { month = b.dataset.m; closeSheet(); render(true); }; });
  };
  $('tabbar').onclick = e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.tab; render(true); };

  // Первый вход: задать пароль (только владелец, вошедший в кабинет)
  function showSetup(can) {
    $('setup').hidden = false; $('setupOk').hidden = !can; $('setupNo').hidden = can;
    if (can) setTimeout(() => $('s1').focus(), 50);
  }
  $('setup').onsubmit = async e => {
    e.preventDefault();
    const p = $('s1').value;
    if (!/^\d{2,12}$/.test(p)) { $('setupErr').textContent = 'Только цифры, от 2 до 12'; return; }
    if (p !== $('s2').value) { $('setupErr').textContent = 'Пароли не совпадают'; return; }
    const r = await api('POST', '/api/money/setpin', { pin: p }).catch(() => ({ ok: false, data: { error: 'Нет связи' } }));
    if (!r.ok) { $('setupErr').textContent = r.data.error || 'Ошибка'; return; }
    $('setup').hidden = true; start();
  };

  api('GET', '/api/money/me').then(r => (r.data.in ? start() : r.data.setup ? showSetup(r.data.canSetup) : showLogin())).catch(showLogin);
})();
</script>
</body>
</html>
