# nginx принимает посетителей на 80/443 и передаёт сайту на 127.0.0.1:3000.
# HTTPS (порт 443) добавит certbot командой из deploy/README.md.
server {
    listen 80;
    listen [::]:80;
    server_name kvartiry.asia www.kvartiry.asia;

    # Менеджеры загружают по нескольку фото с телефона за раз
    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
